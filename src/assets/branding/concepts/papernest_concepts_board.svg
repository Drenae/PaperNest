<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Concepts d’identité visuelle PaperNest</title>
  <desc id="desc">Comparaison des concepts Fold, Stack et Box sur fonds clair et sombre.</desc>
  <rect width="960" height="420" rx="24" fill="#F5F6F8"/>
  <text x="40" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#17191F">PaperNest — symboles compacts</text>
  <text x="40" y="76" font-family="Arial, sans-serif" font-size="14" fill="#5F636D">Jaune PaperNest #F9A825 · anthracite #17191F · SVG sans dégradé</text>

  <g transform="translate(40 105)">
    <rect width="270" height="270" rx="20" fill="#FFFFFF" stroke="#D9DCE3"/>
    <g transform="translate(83 38) scale(1.62)">
      <path d="M15 10h23l11 11v30a3 3 0 0 1-3 3H18a3 3 0 0 1-3-3V13a3 3 0 0 1 3-3Z" fill="#F9A825"/>
      <path d="M38 10v11h11M23 30h18M23 38h18M23 46h12" fill="none" stroke="#17191F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="135" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17191F">01 — Fold</text>
    <text x="135" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5F636D">Document plié, direct et lisible</text>
  </g>

  <g transform="translate(345 105)">
    <rect width="270" height="270" rx="20" fill="#17191F"/>
    <g transform="translate(83 38) scale(1.62)">
      <rect x="10" y="18" width="38" height="34" rx="5" fill="#0E1015"/>
      <rect x="16" y="12" width="38" height="34" rx="5" fill="#F9A825"/>
      <path d="M26 23h18M26 31h18M26 39h12" fill="none" stroke="#17191F" stroke-width="4" stroke-linecap="round"/>
      <path d="M13 52h34" fill="none" stroke="#F9A825" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="135" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">02 — Stack</text>
    <text x="135" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#B8BCC6">Documents superposés, plus distinctif</text>
  </g>

  <g transform="translate(650 105)">
    <rect width="270" height="270" rx="20" fill="#FFFFFF" stroke="#D9DCE3"/>
    <g transform="translate(83 38) scale(1.62)">
      <rect x="10" y="18" width="44" height="36" rx="6" fill="#17191F"/>
      <rect x="7" y="11" width="50" height="13" rx="4" fill="#F9A825"/>
      <rect x="23" y="29" width="18" height="17" rx="2" fill="#F9A825"/>
      <path d="M28 35h8M28 40h8" fill="none" stroke="#17191F" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="135" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17191F">03 — Box</text>
    <text x="135" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5F636D">Archive structurée, plus institutionnelle</text>
  </g>

  <text x="40" y="402" font-family="Arial, sans-serif" font-size="13" fill="#5F636D">Ces fichiers sont des concepts de travail, pas encore les assets finaux intégrés à l’application.</text>
</svg>
